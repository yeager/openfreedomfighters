name: Windows native dependencies
description: Build pinned zlib, FreeType, libogg, and libvorbis dependencies for MSVC

runs:
  using: composite
  steps:
    - name: Build zlib, FreeType, libogg, and libvorbis
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        git clone --filter=blob:none https://github.com/madler/zlib.git zlib-src
        git -C zlib-src checkout da607da739fa6047df13e66a2af6b8bec7c2a498
        cmake -S zlib-src -B zlib-build -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/zlib-install"
        cmake --build zlib-build --config Release --parallel 2
        cmake --install zlib-build --config Release

        git clone --filter=blob:none https://github.com/freetype/freetype.git freetype-src
        git -C freetype-src checkout 42608f77f20749dd6ddc9e0536788eaad70ea4b5
        cmake -S freetype-src -B freetype-build -DBUILD_SHARED_LIBS=OFF -DFT_DISABLE_BZIP2=ON -DFT_DISABLE_BROTLI=ON -DFT_DISABLE_HARFBUZZ=ON -DFT_DISABLE_PNG=ON -DFT_DISABLE_ZLIB=ON -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/freetype-install"
        cmake --build freetype-build --config Release --parallel 2
        cmake --install freetype-build --config Release

        git clone --filter=blob:none https://github.com/xiph/ogg.git ogg-src
        git -C ogg-src checkout be05b13e98b048f0b5a0f5fa8ce514d56db5f822
        cmake -S ogg-src -B ogg-build -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DINSTALL_DOCS=OFF -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/ogg-install"
        cmake --build ogg-build --config Release --parallel 2
        cmake --install ogg-build --config Release

        git clone --filter=blob:none https://github.com/xiph/vorbis.git vorbis-src
        git -C vorbis-src checkout 0657aee69dec8508a0011f47f3b69d7538e9d262
        cmake -S vorbis-src -B vorbis-build -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH="${{ github.workspace }}/ogg-install" -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/vorbis-install"
        cmake --build vorbis-build --config Release --parallel 2
        cmake --install vorbis-build --config Release
