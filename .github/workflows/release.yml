name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v, for example 0.1.0'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvorbis-dev zlib1g-dev libfreetype-dev \
            libasound2-dev libpulse-dev libfribidi-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libudev-dev libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev \
            libwayland-dev libdecor-0-dev liburing-dev xvfb libvulkan1 mesa-vulkan-drivers
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ctest --test-dir build -j4 --output-on-failure \
            --output-junit ctest-results.xml
          python3 -c 'import sys, xml.etree.ElementTree as ET; skipped=[case.attrib.get("name", "unnamed") for case in ET.parse("build/ctest-results.xml").iter("testcase") if case.find("skipped") is not None]; sys.exit("Skipped CTest cases: " + ", ".join(skipped) if skipped else 0)'
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --prefix package
          missing_data_root="$PWD/package/absent-game-data"
          test ! -e "$missing_data_root"
          missing_data_stdout="$PWD/missing-data.stdout"
          missing_data_stderr="$PWD/missing-data.stderr"
          status=0
          SDL_VIDEODRIVER=dummy package/bin/openfreedomfighters \
            --data "$missing_data_root" --locale en \
            >"$missing_data_stdout" 2>"$missing_data_stderr" || status=$?
          if [ "$status" -ne 3 ]; then
            echo "installed missing-data launch exited with $status, expected 3" >&2
            exit 1
          fi
          test ! -s "$missing_data_stdout"
          test "$(tr -d '\r\n' < "$missing_data_stderr")" = \
            "Game-data verification failed: game-data directory does not exist"
          cp README.md LICENSE THIRD_PARTY.md package/
          tar -czf OpenFreedomFighters-linux-x86_64.tar.gz -C package .
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: OpenFreedomFighters-linux-x86_64.tar.gz
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: brew install cmake freetype libvorbis ninja zlib
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix zlib);$(brew --prefix freetype);$(brew --prefix libogg);$(brew --prefix libvorbis)"
          ninja -C build
          ctest --test-dir build -j4 --output-on-failure
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --prefix package
          missing_data_root="$PWD/package/absent-game-data"
          test ! -e "$missing_data_root"
          missing_data_stdout="$PWD/missing-data.stdout"
          missing_data_stderr="$PWD/missing-data.stderr"
          status=0
          SDL_VIDEODRIVER=dummy package/bin/openfreedomfighters \
            --data "$missing_data_root" --locale en \
            >"$missing_data_stdout" 2>"$missing_data_stderr" || status=$?
          if [ "$status" -ne 3 ]; then
            echo "installed missing-data launch exited with $status, expected 3" >&2
            exit 1
          fi
          test ! -s "$missing_data_stdout"
          test "$(tr -d '\r\n' < "$missing_data_stderr")" = \
            "Game-data verification failed: game-data directory does not exist"
          cp README.md LICENSE THIRD_PARTY.md package/
          tar -czf OpenFreedomFighters-macos.tar.gz -C package .
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: OpenFreedomFighters-macos.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build dependencies
        uses: ./.github/actions/windows-dependencies
      - name: Build and test
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_PREFIX_PATH="${{ github.workspace }}/zlib-install;${{ github.workspace }}/freetype-install;${{ github.workspace }}/ogg-install;${{ github.workspace }}/vorbis-install"
          cmake --build build --config Release --parallel 2
          $env:PATH = "${{ github.workspace }}/zlib-install/bin;$env:PATH"
          ctest --test-dir build -C Release -j4 --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --install build --config Release --prefix package
          $zlib = Get-ChildItem "${{ github.workspace }}/zlib-install/bin" -Filter '*.dll'
          if ($zlib) { Copy-Item $zlib.FullName package/bin/ }
          $missingDataRoot = Join-Path (Get-Location) 'package/absent-game-data'
          if (Test-Path -LiteralPath $missingDataRoot) { throw 'missing-data fixture root unexpectedly exists' }
          $missingDataStdout = Join-Path (Get-Location) 'missing-data.stdout'
          $missingDataStderr = Join-Path (Get-Location) 'missing-data.stderr'
          & package/bin/openfreedomfighters.exe --data $missingDataRoot --locale en 1> $missingDataStdout 2> $missingDataStderr
          $missingDataStatus = $LASTEXITCODE
          if ($missingDataStatus -ne 3) { throw "installed missing-data launch exited with $missingDataStatus, expected 3" }
          if ((Get-Item -LiteralPath $missingDataStdout).Length -ne 0) { throw 'installed missing-data launch wrote unexpected stdout' }
          $missingDataMessage = [System.IO.File]::ReadAllText($missingDataStderr).TrimEnd("`r", "`n")
          if ($missingDataMessage -cne 'Game-data verification failed: game-data directory does not exist') { throw "installed missing-data launch reported unexpected stderr: $missingDataMessage" }
          Copy-Item README.md, LICENSE, THIRD_PARTY.md package/
          Compress-Archive -Path package/* -DestinationPath OpenFreedomFighters-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: OpenFreedomFighters-windows-x64.zip
          if-no-files-found: error

  create-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Verify release version matches CMake
        shell: bash
        run: |
          set -euo pipefail
          requested_version="${RELEASE_VERSION#v}"
          project_version=$(sed -n 's/^project(OpenFreedomFighters VERSION \([^ ]*\) LANGUAGES .*)/\1/p' CMakeLists.txt)
          test -n "$project_version"
          test "$requested_version" = "$project_version"
      - name: Verify artifacts contain no retail data
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/linux-x86_64/OpenFreedomFighters-linux-x86_64.tar.gz
          test -s artifacts/macos/OpenFreedomFighters-macos.tar.gz
          test -s artifacts/windows-x64/OpenFreedomFighters-windows-x64.zip
          python3 tools/verify_release_package.py linux artifacts/linux-x86_64/OpenFreedomFighters-linux-x86_64.tar.gz
          python3 tools/verify_release_package.py macos artifacts/macos/OpenFreedomFighters-macos.tar.gz
          python3 tools/verify_release_package.py windows artifacts/windows-x64/OpenFreedomFighters-windows-x64.zip
      - name: Scan repository with Gitleaks
        uses: ./.github/actions/gitleaks
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: OpenFreedomFighters ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            artifacts/linux-x86_64/OpenFreedomFighters-linux-x86_64.tar.gz
            artifacts/macos/OpenFreedomFighters-macos.tar.gz
            artifacts/windows-x64/OpenFreedomFighters-windows-x64.zip
          generate_release_notes: true
