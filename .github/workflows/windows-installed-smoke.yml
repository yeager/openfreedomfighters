name: Windows installed executable smoke

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  contents: read

# This intentionally has separate concurrency from Build. A loader-stalled
# native child is contained by this short-lived diagnostic workflow and cannot
# hold the build/test gate or a later Build run hostage.
concurrency:
  group: windows-installed-smoke-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  installed-executable:
    # Artifacts from pull-request workflows are not executed here. Main is the
    # only publishing branch, so the artifact and the workflow are from the
    # same trusted repository history.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: windows-2022
    timeout-minutes: 4
    steps:
      - name: Download installed executable smoke input
        uses: actions/download-artifact@v8
        with:
          name: windows-installed-smoke-input
          path: smoke-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify installed executable version and missing-data failure
        shell: pwsh
        # A direct native invocation is deliberate: it verifies the actual
        # installed executable, while the step and job deadlines cap a loader
        # hang without coupling it to compilation or the next Build workflow.
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          function Write-InstalledExecutableDiagnostics {
            param([Parameter(Mandatory = $true)][string]$Executable)

            Write-Host "Installed executable diagnostics for $Executable"
            Get-Item -LiteralPath $Executable | Format-List FullName,Length,CreationTimeUtc,LastWriteTimeUtc
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $dumpbin = if (Test-Path -LiteralPath $vswhere) {
              $installationPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
              if ($installationPath) {
                Get-ChildItem -Path (Join-Path $installationPath 'VC/Tools/MSVC') -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '\\Hostx64\\x64\\dumpbin\.exe$' } |
                  Select-Object -First 1 -ExpandProperty FullName
              }
            }
            if ($dumpbin) {
              Write-Host 'PE headers:'
              & $dumpbin /headers $Executable
              Write-Host 'PE dependencies:'
              & $dumpbin /dependents $Executable
            } else {
              Write-Warning 'dumpbin.exe was not available for PE diagnostics.'
            }
          }

          $archive = Join-Path (Get-Location) 'smoke-input/windows-installed-smoke-input.zip'
          if (!(Test-Path -LiteralPath $archive)) { throw 'installed executable smoke archive is missing' }
          $inputRoot = Join-Path (Get-Location) 'smoke-input/unpacked'
          Expand-Archive -Path $archive -DestinationPath $inputRoot
          $executable = Join-Path $inputRoot 'install-check/bin/openfreedomfighters.exe'
          $runtimeBin = Join-Path $inputRoot 'runtime'
          $expectedVersionPath = Join-Path $inputRoot 'expected-version.txt'
          if (!(Test-Path -LiteralPath $executable)) { throw 'installed executable smoke input is missing' }
          if (!(Test-Path -LiteralPath $runtimeBin)) { throw 'zlib runtime smoke input is missing' }
          if (!(Test-Path -LiteralPath $expectedVersionPath)) { throw 'installed executable expected-version input is missing' }
          $expectedVersion = [System.IO.File]::ReadAllText($expectedVersionPath).Trim()
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) { throw 'installed executable expected version is empty' }
          $env:PATH = "$runtimeBin;$env:PATH"
          Write-InstalledExecutableDiagnostics -Executable $executable

          $versionStdout = Join-Path (Get-Location) 'installed-version.stdout'
          $versionStderr = Join-Path (Get-Location) 'installed-version.stderr'
          & $executable --version 1> $versionStdout 2> $versionStderr
          $versionStatus = $LASTEXITCODE
          if ($versionStatus -ne 0) {
            throw "installed executable --version failed with exit code ${versionStatus}: $([System.IO.File]::ReadAllText($versionStderr))"
          }
          $versionOutput = [System.IO.File]::ReadAllText($versionStdout).TrimEnd("`r", "`n")
          if ($versionOutput -cne "OpenFreedomFighters $expectedVersion") {
            throw "installed executable reported unexpected version: $versionOutput"
          }

          $missingDataRoot = Join-Path (Get-Location) 'absent-game-data'
          if (Test-Path -LiteralPath $missingDataRoot) { throw 'missing-data fixture root unexpectedly exists' }
          $missingDataStdout = Join-Path (Get-Location) 'missing-data.stdout'
          $missingDataStderr = Join-Path (Get-Location) 'missing-data.stderr'
          & $executable --data $missingDataRoot --locale en 1> $missingDataStdout 2> $missingDataStderr
          $missingDataStatus = $LASTEXITCODE
          if ($missingDataStatus -ne 3) { throw "installed missing-data launch exited with $missingDataStatus, expected 3" }
          if ((Get-Item -LiteralPath $missingDataStdout).Length -ne 0) { throw 'installed missing-data launch wrote unexpected stdout' }
          $missingDataMessage = [System.IO.File]::ReadAllText($missingDataStderr).TrimEnd("`r", "`n")
          if ($missingDataMessage -cne 'Game-data verification failed: game-data directory does not exist') {
            throw "installed missing-data launch reported unexpected stderr: $missingDataMessage"
          }
