name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject tracked retail-data formats
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -Eai '\.(exe|dll|zip|wav|whd|loc|tex|prm|zgf|gms|oct|anm|buf|rmc|rmi|sgp|snd|sup)$' || true)
          if [ -n "$forbidden" ]; then
            echo "Tracked files use prohibited retail-data extensions:" >&2
            echo "$forbidden" >&2
            exit 1
          fi
      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          ninja -C build
      - name: Test
        run: ctest --test-dir build -j4 --output-on-failure
      - name: Run Python analysis-tool tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test with address and undefined-behavior sanitizers
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          ninja -C build-sanitize
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build-sanitize -j4 --output-on-failure

  build-macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: brew install cmake ninja zlib
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$(brew --prefix zlib)"
          ninja -C build
      - name: Test
        run: ctest --test-dir build -j4 --output-on-failure

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build zlib
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/madler/zlib.git zlib-src
          cmake -S zlib-src -B zlib-build -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/zlib-install"
          cmake --build zlib-build --config Release --parallel 2
          cmake --install zlib-build --config Release
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/zlib-install"
          cmake --build build --config Release --parallel 2
      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}/zlib-install/bin;$env:PATH"
          ctest --test-dir build -C Release -j4 --output-on-failure
