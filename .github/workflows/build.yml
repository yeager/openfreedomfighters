name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  picture-dxil:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TMPDIR: ${{ github.workspace }}/.shader-work
      TMP: ${{ github.workspace }}/.shader-work
      TEMP: ${{ github.workspace }}/.shader-work
    steps:
      - uses: actions/checkout@v6
      - name: Fetch checksum-pinned DXC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .shader-work/dxc
          curl --fail --location --retry 3 \
            --output .shader-work/dxc.tar.gz \
            https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602/linux_dxc_2026_02_20.x86_64.tar.gz
          printf '%s  %s\n' a1d3e3b5e1c5685b3eb27d5e8890e41d87df45def05112a2d6f1a63a931f7d60 .shader-work/dxc.tar.gz | sha256sum --check -
          tar -xzf .shader-work/dxc.tar.gz -C .shader-work/dxc
      - name: Compile and validate picture DXIL
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_picture_dxil.py --dxc .shader-work/dxc/bin/dxc \
            --work-dir .shader-work --output .shader-work/picture_stage_dxil.hpp
          if test -f include/off/platform/generated/picture_stage_dxil.hpp; then
            cmp include/off/platform/generated/picture_stage_dxil.hpp .shader-work/picture_stage_dxil.hpp
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: picture-stage-dxil
          path: .shader-work/picture_stage_dxil.hpp
          if-no-files-found: error
          include-hidden-files: true

  content-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject tracked retail-data formats
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -Eai '\.(exe|dll|zip|wav|ogg|whd|loc|tex|prm|zgf|gms|oct|anm|buf|rmc|rmi|sgp|snd|sup)$' || true)
          if [ -n "$forbidden" ]; then
            echo "Tracked files use prohibited retail-data extensions:" >&2
            echo "$forbidden" >&2
            exit 1
          fi
      - name: Scan repository with Gitleaks
        uses: ./.github/actions/gitleaks

  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvorbis-dev zlib1g-dev libfreetype-dev \
            libasound2-dev libpulse-dev libfribidi-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libudev-dev libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev \
            libwayland-dev libdecor-0-dev liburing-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          ninja -C build
      - name: Test
        run: ctest --test-dir build -j4 --output-on-failure
      - name: Run Python analysis-tool tests
        run: |
          python3 -m pip install --requirement requirements-analysis.txt
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test with address and undefined-behavior sanitizers
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          ninja -C build-sanitize
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build-sanitize -j4 --output-on-failure

  build-macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: brew install cmake freetype libvorbis ninja zlib
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$(brew --prefix zlib);$(brew --prefix freetype);$(brew --prefix libogg);$(brew --prefix libvorbis)"
          ninja -C build
      - name: Test
        run: ctest --test-dir build -j4 --output-on-failure

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build dependencies
        uses: ./.github/actions/windows-dependencies
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/zlib-install;${{ github.workspace }}/freetype-install;${{ github.workspace }}/ogg-install;${{ github.workspace }}/vorbis-install"
          cmake --build build --config Release --parallel 2
      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}/zlib-install/bin;$env:PATH"
          ctest --test-dir build -C Release -j4 --output-on-failure
