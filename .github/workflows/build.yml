name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  picture-dxil:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TMPDIR: ${{ github.workspace }}/.shader-work
      TMP: ${{ github.workspace }}/.shader-work
      TEMP: ${{ github.workspace }}/.shader-work
    steps:
      - uses: actions/checkout@v6
      - name: Fetch checksum-pinned DXC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .shader-work/dxc
          curl --fail --location --retry 3 \
            --output .shader-work/dxc.tar.gz \
            https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602/linux_dxc_2026_02_20.x86_64.tar.gz
          printf '%s  %s\n' a1d3e3b5e1c5685b3eb27d5e8890e41d87df45def05112a2d6f1a63a931f7d60 .shader-work/dxc.tar.gz | sha256sum --check -
          tar -xzf .shader-work/dxc.tar.gz -C .shader-work/dxc
      - name: Compile and validate picture DXIL
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_picture_dxil.py --dxc .shader-work/dxc/bin/dxc \
            --work-dir .shader-work --output .shader-work/picture_stage_dxil.hpp
          cmp include/off/platform/generated/picture_stage_dxil.hpp .shader-work/picture_stage_dxil.hpp
      - uses: actions/upload-artifact@v7
        with:
          name: picture-stage-dxil
          path: .shader-work/picture_stage_dxil.hpp
          if-no-files-found: error
          include-hidden-files: true

  content-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject tracked retail-data formats
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -Eai '\.(exe|dll|zip|wav|ogg|whd|loc|tex|prm|zgf|gms|oct|anm|buf|rmc|rmi|sgp|snd|sup)$' || true)
          if [ -n "$forbidden" ]; then
            echo "Tracked files use prohibited retail-data extensions:" >&2
            echo "$forbidden" >&2
            exit 1
          fi
      - name: Scan repository with Gitleaks
        uses: ./.github/actions/gitleaks

  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvorbis-dev zlib1g-dev libfreetype-dev \
            libasound2-dev libpulse-dev libfribidi-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libudev-dev libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev \
            libwayland-dev libdecor-0-dev liburing-dev xvfb libvulkan1 mesa-vulkan-drivers
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          ninja -C build
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ctest --test-dir build -j4 --output-on-failure \
            --output-junit ctest-results.xml
          python3 -c 'import sys, xml.etree.ElementTree as ET; skipped=[case.attrib.get("name", "unnamed") for case in ET.parse("build/ctest-results.xml").iter("testcase") if case.find("skipped") is not None]; sys.exit("Skipped CTest cases: " + ", ".join(skipped) if skipped else 0)'
      - name: Verify install layout
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --prefix install-check
          test -x install-check/bin/openfreedomfighters
          test -f install-check/bin/assets/openfreedomfighters-splash.bmp
          test -f install-check/bin/assets/Rajdhani-SemiBold.ttf
          test -f install-check/share/applications/openfreedomfighters.desktop
          project_version=$(sed -n 's/^project(OpenFreedomFighters VERSION \([^ ]*\) LANGUAGES .*)/\1/p' CMakeLists.txt)
          test -n "$project_version"
          test "$(install-check/bin/openfreedomfighters --version)" = "OpenFreedomFighters $project_version"
          missing_data_root="$PWD/install-check/absent-game-data"
          test ! -e "$missing_data_root"
          missing_data_stdout="$PWD/missing-data.stdout"
          missing_data_stderr="$PWD/missing-data.stderr"
          status=0
          SDL_VIDEODRIVER=dummy install-check/bin/openfreedomfighters \
            --data "$missing_data_root" --locale en \
            >"$missing_data_stdout" 2>"$missing_data_stderr" || status=$?
          if [ "$status" -ne 3 ]; then
            echo "installed missing-data launch exited with $status, expected 3" >&2
            exit 1
          fi
          test ! -s "$missing_data_stdout"
          test "$(tr -d '\r\n' < "$missing_data_stderr")" = \
            "Game-data verification failed: game-data directory does not exist"
      - name: Run Python analysis-tool tests
        run: |
          python3 -m pip install --requirement requirements-analysis.txt
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test with address and undefined-behavior sanitizers
        run: |
          cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          ninja -C build-sanitize
          # SDL's X11 backend retains process-global keyboard state under
          # LeakSanitizer. The normal Linux test gate already requires these
          # GPU tests; run the remaining suite under ASan/UBSan.
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build-sanitize -j4 --output-on-failure \
            -E '^(off_sdl_intro_presentation_tests|off_sdl_intro_renderer_tests|off_sdl_picture_stage_shader_tests|off_sdl_picture_clear_tests|off_sdl_picture_depth_stencil_tests)$'

  build-macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: brew install cmake freetype libvorbis ninja zlib
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$(brew --prefix zlib);$(brew --prefix freetype);$(brew --prefix libogg);$(brew --prefix libvorbis)"
          ninja -C build
      - name: Test
        run: ctest --test-dir build -j4 --output-on-failure
      - name: Verify install layout
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --prefix install-check
          test -x install-check/bin/openfreedomfighters
          test -f install-check/bin/assets/openfreedomfighters-splash.bmp
          test -f install-check/bin/assets/Rajdhani-SemiBold.ttf
          project_version=$(sed -n 's/^project(OpenFreedomFighters VERSION \([^ ]*\) LANGUAGES .*)/\1/p' CMakeLists.txt)
          test -n "$project_version"
          test "$(install-check/bin/openfreedomfighters --version)" = "OpenFreedomFighters $project_version"
          missing_data_root="$PWD/install-check/absent-game-data"
          test ! -e "$missing_data_root"
          missing_data_stdout="$PWD/missing-data.stdout"
          missing_data_stderr="$PWD/missing-data.stderr"
          status=0
          SDL_VIDEODRIVER=dummy install-check/bin/openfreedomfighters \
            --data "$missing_data_root" --locale en \
            >"$missing_data_stdout" 2>"$missing_data_stderr" || status=$?
          if [ "$status" -ne 3 ]; then
            echo "installed missing-data launch exited with $status, expected 3" >&2
            exit 1
          fi
          test ! -s "$missing_data_stdout"
          test "$(tr -d '\r\n' < "$missing_data_stderr")" = \
            "Game-data verification failed: game-data directory does not exist"
      - name: Verify intro GPU rendering and presentation on Metal when available
        run: OFF_PICTURE_SHADER_TEST_DRIVER=metal ctest --test-dir build -R '^off_sdl_(picture_stage_shader|intro_renderer|intro_presentation)_tests$' -V

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build dependencies
        uses: ./.github/actions/windows-dependencies
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_PREFIX_PATH="${{ github.workspace }}/zlib-install;${{ github.workspace }}/freetype-install;${{ github.workspace }}/ogg-install;${{ github.workspace }}/vorbis-install"
          cmake --build build --config Release --parallel 2
      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}/zlib-install/bin;$env:PATH"
          ctest --test-dir build -C Release -j4 --output-on-failure
      - name: Verify install layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --install build --config Release --prefix install-check
          if (!(Test-Path install-check/bin/openfreedomfighters.exe)) { throw 'installed executable is missing' }
          if (!(Test-Path install-check/bin/assets/openfreedomfighters-splash.bmp)) { throw 'installed splash asset is missing' }
          if (!(Test-Path install-check/bin/assets/Rajdhani-SemiBold.ttf)) { throw 'installed font asset is missing' }
          $env:PATH = "${{ github.workspace }}/zlib-install/bin;$env:PATH"
          $projectVersion = (Select-String -Path CMakeLists.txt -Pattern '^project\(OpenFreedomFighters VERSION ([^ ]+) LANGUAGES ' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          if ([string]::IsNullOrWhiteSpace($projectVersion)) { throw 'CMake project version is missing' }
          $versionOutput = & install-check/bin/openfreedomfighters.exe --version
          if ($LASTEXITCODE -ne 0) { throw "installed executable --version failed with exit code $LASTEXITCODE" }
          if ($versionOutput -ne "OpenFreedomFighters $projectVersion") { throw "installed executable reported unexpected version: $versionOutput" }
          $missingDataRoot = Join-Path (Get-Location) 'install-check/absent-game-data'
          if (Test-Path -LiteralPath $missingDataRoot) { throw 'missing-data fixture root unexpectedly exists' }
          $missingDataStdout = Join-Path (Get-Location) 'missing-data.stdout'
          $missingDataStderr = Join-Path (Get-Location) 'missing-data.stderr'
          & install-check/bin/openfreedomfighters.exe --data $missingDataRoot --locale en 1> $missingDataStdout 2> $missingDataStderr
          $missingDataStatus = $LASTEXITCODE
          if ($missingDataStatus -ne 3) { throw "installed missing-data launch exited with $missingDataStatus, expected 3" }
          if ((Get-Item -LiteralPath $missingDataStdout).Length -ne 0) { throw 'installed missing-data launch wrote unexpected stdout' }
          $missingDataMessage = [System.IO.File]::ReadAllText($missingDataStderr).TrimEnd("`r", "`n")
          if ($missingDataMessage -cne 'Game-data verification failed: game-data directory does not exist') { throw "installed missing-data launch reported unexpected stderr: $missingDataMessage" }
      - name: Verify intro GPU rendering and presentation on D3D12 when available
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}/zlib-install/bin;$env:PATH"
          $env:OFF_PICTURE_SHADER_TEST_DRIVER = "direct3d12"
          ctest --test-dir build -C Release -R '^off_sdl_(picture_stage_shader|intro_renderer|intro_presentation)_tests$' -V
